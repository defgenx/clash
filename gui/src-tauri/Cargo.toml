[package]
name = "clash-gui"
version = "1.158.1"
edition = "2021"
description = "clash GUI — cmux-style desktop client (experimental)"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
clash = { path = "../.." }
# `unstable` enables multiwebview (Window::add_child) for the embedded browser tabs
# `devtools` exposes open_devtools() for browser tabs in release builds
tauri = { version = "2", features = ["unstable", "devtools"] }
# System clipboard for the embedded terminals: WKWebView has no native edit
# menu and xterm's canvas selection isn't a DOM selection, so navigator.clipboard
# is unreliable — copy/paste go through this plugin's Rust API instead.
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tracing = "0.1"
tracing-subscriber = "0.3"
dirs = "6"
uuid = { version = "1", features = ["v7"] }
libc = "0.2"
# The phone remote's HTTP server (docs/remote.md). hyper 1 / tower are already
# in the tree through tauri.
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
# The Machines view polls paired clash instances from the backend (the token
# never goes back to the webview). Already in the tree through tauri.
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSImage", "NSResponder"] }
objc2-foundation = { version = "0.3", features = ["NSData", "NSString", "NSURL", "NSGeometry"] }
