<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="referrer" content="no-referrer" />
<meta id="theme-color" name="theme-color" content="" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="mobile-web-app-capable" content="yes" />
<title>clash remote</title>
<!-- The desktop's own stylesheet: the phone page is the desktop laid out for a
     phone, and the colours are the Mac's (pushed through /api/appearance). -->
<link rel="stylesheet" href="style.css" />
<link rel="stylesheet" href="xterm.css" />
<style>
  /* Phone layout only. Every colour is a desktop token (a test pins it). */
  html, body { height: 100%; overflow: hidden; }
  body.remote { font-size: 14px; user-select: text; -webkit-text-size-adjust: 100%; }
  #r-app { display: flex; height: 100%; padding-top: env(safe-area-inset-top); background: var(--bg-sidebar); }

  /* The sidebar is a drawer: the desktop's sidebar, slid in from the left. */
  body.remote #sidebar {
    position: fixed; z-index: 20; top: 0; bottom: 0; left: 0;
    width: min(88vw, 340px); min-width: 0;
    padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom);
    transform: translateX(-102%); transition: transform 0.2s ease;
    box-shadow: var(--shadow-strong);
  }
  body.drawer-open #sidebar { transform: none; }
  #r-scrim { position: fixed; inset: 0; z-index: 19; background: var(--scrim); opacity: 0; pointer-events: none; transition: opacity 0.2s; }
  body.drawer-open #r-scrim { opacity: 1; pointer-events: auto; }
  #r-side-scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: 12px; }
  body.remote #session-list { flex: none; overflow: visible; min-height: 0; }
  body.remote #sidebar .mx-list { padding: 4px 10px; }
  body.remote #sidebar .mx-card { cursor: pointer; }
  body.remote #sidebar .mx-card.r-selected { border-color: var(--accent); }
  body.remote .mx-pair { padding: 0 10px; margin-top: 6px; }
  body.remote #pair-note { padding: 4px 12px 0; }
  .r-nav { cursor: pointer; }
  .r-nav.selected { color: var(--fg); }

  /* Touch: rows and buttons at least a finger tall; inputs at 16px so iOS
     does not zoom the page when one gets focus. */
  body.remote .session-item { padding: 9px 10px; }
  body.remote .session-name { font-size: 14px; }
  body.remote .session-sub { font-size: 12px; }
  body.remote input, body.remote textarea { font-size: 16px !important; }
  body.remote #search { padding: 8px 10px; }

  body.remote #main { flex: 1; min-width: 0; background: var(--bg); }
  body.remote #topbar { min-height: 44px; padding-right: 4px; }
  body.remote #topbar .icon-btn { width: 44px; height: 44px; }
  body.remote #tabs { overflow: hidden; }
  body.remote .tab { height: 44px; font-size: 13px; min-width: 0; max-width: 100%; border-right: 0; }
  #r-tab-title { overflow: hidden; text-overflow: ellipsis; }
  .r-conn { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; color: var(--fg-dim); white-space: nowrap; max-width: 38vw; overflow: hidden; text-overflow: ellipsis; }
  .r-conn .status-ring { margin: 0; }
  #r-view { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: calc(16px + env(safe-area-inset-bottom)); }

  /* Views reuse the desktop's tab bodies; only the gutters shrink. */
  body.remote .wf-board-head { padding: 12px 12px 8px; }
  body.remote .wf-board-search { width: 100%; }
  body.remote .inbox { padding: 8px 10px; }
  body.remote .inbox-row { flex-wrap: wrap; }
  body.remote .wf-decisions { margin: 6px 10px 16px; }
  .r-empty { margin: 32px 16px; text-align: center; color: var(--fg-dim); line-height: 1.5; }
  .r-section { margin: 14px 10px 0; }
  .r-section > .section-label { padding: 0 2px 6px; }
  .r-error { margin: 10px; color: var(--red); font-size: 13px; }

  /* A session: the terminal as the desktop draws it, shrunk to the width. */
  .r-term-box { margin: 10px 10px 0; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; background: var(--bg); }
  .r-term-box.actual { overflow-x: auto; }
  .r-term-scale { transform-origin: 0 0; padding: 6px; }
  .r-term-tools { display: flex; align-items: center; gap: 8px; margin: 6px 10px 0; font-size: 11px; color: var(--fg-dim); }
  .r-term-tools .spacer { flex: 1; }
  .r-keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 10px 10px 0; }
  body.remote .r-keys button { padding: 11px 4px; font-size: 13px; }
  /* The desktop's button look (style.css's baseline), finger-sized. */
  .r-wide {
    width: 100%; margin-top: 8px; padding: 11px 10px; font: inherit; font-size: 14px; font-weight: 600;
    background: var(--bg-hover); color: var(--fg); border: 1px solid var(--border); border-radius: 5px; cursor: pointer;
  }
  .r-wide.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .r-wide.danger { color: var(--red); }
  body.remote .inbox-filters { display: flex; max-width: 100%; overflow-x: auto; scrollbar-width: none; }
  body.remote .inbox-filters::-webkit-scrollbar { display: none; }
  body.remote .inbox-filters .wf-seg { flex: none; }
  body.remote .wf-board-search { max-width: none; }
  body.remote .mx-pair button { padding: 0 14px; }
  body.remote .wf-inline-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  button.armed { background: var(--accent) !important; color: var(--on-accent) !important; border-color: var(--accent) !important; }
  button.danger.armed { background: var(--red) !important; border-color: var(--red) !important; }
  .r-note { margin: 6px 12px 0; }
  .wf-decision-option { width: 100%; text-align: left; }

  /* A workflow item's header, like the desktop item tab's. */
  .r-item-head { padding: 12px 12px 4px; }
  .r-item-head h2 { margin: 0 0 4px; font-size: 16px; line-height: 1.3; }
  .r-item-sub { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 12px; color: var(--fg-dim); }
</style>
</head>
<body class="remote">
  <div id="r-app">
    <aside id="sidebar" aria-label="Sidebar">
      <div id="sidebar-header">
        <img class="logo" src="logo.svg" alt="clash" />
        <span class="badge">REMOTE</span>
        <span class="spacer"></span>
        <button id="r-close" class="icon-btn" type="button" aria-label="Close the sidebar">✕</button>
      </div>
      <div id="r-side-scroll">
        <div class="section-label">MACHINES</div>
        <div id="r-machines" class="mx-list"></div>
        <form id="pair-form" class="mx-pair" autocomplete="off">
          <input id="pair-link" class="wf-board-search" type="url" placeholder="Paste a pairing link" inputmode="url" />
          <button class="primary" type="submit">Pair</button>
        </form>
        <p id="pair-note" class="hint"></p>
        <div id="r-inbox-nav" class="section-label r-nav">INBOX <span id="r-inbox-count" class="count">0</span></div>
        <div id="search-wrap"><input id="search" type="search" placeholder="Search sessions…" autocomplete="off" spellcheck="false" /></div>
        <div id="session-list"></div>
        <div id="wf-section"><div id="wf-list"></div></div>
      </div>
    </aside>
    <div id="r-scrim"></div>
    <main id="main">
      <div id="topbar">
        <button id="r-menu" class="icon-btn" type="button" aria-label="Open the sidebar">☰</button>
        <div id="tabs"><div id="r-tab" class="tab active"><span id="r-tab-dot" class="tab-dot"></span><span id="r-tab-title">Inbox</span></div></div>
        <div id="topbar-actions"><span id="conn" class="r-conn" role="status" aria-live="polite"></span></div>
      </div>
      <div id="r-view"></div>
    </main>
  </div>

  <script src="xterm.js"></script>
  <script src="status-info.js"></script>
  <script src="attention.js"></script>
  <script src="wf-decisions.js"></script>
  <script src="remote-model.js"></script>
  <script src="remote.js"></script>
</body>
</html>
