<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>clash</title>
  <link rel="stylesheet" href="vendor/xterm.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div id="sidebar-header">
        <img class="logo" src="logo.svg" alt="clash" />
        <span class="badge">GUI</span>
        <span class="spacer"></span>
        <button id="tui-btn" class="icon-btn" title="Launch the clash TUI in a terminal"></button>
      </div>
      <div id="workspace-bar">
        <div id="workspace-chips"></div>
        <button id="new-ws-btn" class="icon-btn mini" title="New workspace (⌘N)">+</button>
      </div>
      <button id="new-session-btn" class="primary-action" title="Start a new Claude Code session (⌘T)">＋ New session</button>
      <div id="search-wrap">
        <input id="search" type="text" placeholder="Search sessions…  ( / )" autocomplete="off" spellcheck="false" />
      </div>
      <div id="session-list"></div>
      <div class="section-resizer hidden" id="wf-resizer" title="Drag to resize"></div>
      <div id="wf-section">
        <div class="section-label collapsible" id="wf-toggle">WORKFLOWS <span id="wf-caret">▸</span><span id="wf-badge" class="wf-badge hidden"></span>
          <button id="wf-board-btn" class="icon-btn mini" title="Open workflow board">⊞</button>
          <button id="wf-prs-btn" class="icon-btn mini" title="PR dashboard — every workflow item with a pull request, across all projects">⇄</button>
          <button id="wf-skills-btn" class="icon-btn mini" title="Skills — view the agent skills clash ships"></button>
          <button id="refresh-wf-btn" class="icon-btn mini" title="Refresh workflows"></button>
          <button id="new-wf-btn" class="icon-btn mini" title="New workflow item">+</button>
        </div>
        <div id="wf-list" class="hidden"></div>
      </div>
      <div class="section-resizer hidden" id="notes-resizer" title="Drag to resize"></div>
      <div id="notes-section">
        <div class="section-label collapsible" id="notes-toggle">SCRATCHES <span id="notes-caret">▸</span>
          <button id="refresh-notes-btn" class="icon-btn mini" title="Refresh scratches"></button>
          <button id="new-note-btn" class="icon-btn mini" title="New scratch">+</button>
        </div>
        <div id="notes-list" class="hidden"></div>
      </div>
      <div class="section-resizer hidden" id="teams-resizer" title="Drag to resize"></div>
      <div id="teams-section">
        <div class="section-label collapsible" id="teams-toggle">TEAMS <span id="teams-caret">▸</span>
          <button id="new-team-btn" class="icon-btn mini" title="New team">+</button>
        </div>
        <div id="teams-list" class="hidden"></div>
      </div>
      <div id="sidebar-footer">
        <div class="section-label collapsible" id="settings-toggle">SETTINGS <span id="settings-caret">▸</span></div>
        <div id="settings-body" class="hidden">
        <input id="settings-filter" type="search" placeholder="Filter settings…" autocomplete="off" spellcheck="false" />

        <div class="settings-group">Appearance</div>
        <label class="setting-row">Theme
          <select id="set-theme" title="Recolors the whole app and every terminal (◐ dark · ◑ light)"></select>
        </label>

        <div class="settings-group">Paths</div>
        <label class="setting-row">Default directory
          <span class="input-with-btn">
            <input id="default-cwd" type="text" placeholder="/Users/you" autocomplete="off" spellcheck="false" />
            <button id="default-cwd-browse" class="icon-btn" title="Browse for a directory" type="button"></button>
          </span>
        </label>
        <label class="setting-row">Scratch directory
          <span class="input-with-btn">
            <input id="set-scratch-dir" type="text" placeholder="~/.claude/clash/scratch" autocomplete="off" spellcheck="false" />
            <button id="set-scratch-dir-browse" class="icon-btn" title="Browse for a directory" type="button"></button>
          </span>
        </label>
        <label class="setting-row">Workflows directory
          <span class="input-with-btn">
            <input id="set-workflows-dir" type="text" placeholder="~/.claude/clash/workflows" autocomplete="off" spellcheck="false" />
            <button id="set-workflows-dir-browse" class="icon-btn" title="Browse for a directory" type="button"></button>
          </span>
        </label>
        <label class="setting-row">Claude binary
          <span class="input-with-btn">
            <input id="set-claude-bin" type="text" placeholder="claude" autocomplete="off" spellcheck="false" title="Name resolved on PATH, or an absolute path. Applies to sessions started from now on." />
            <button id="set-claude-bin-browse" class="icon-btn" title="Browse for the claude executable" type="button"></button>
          </span>
        </label>

        <div class="settings-group">Workflows</div>
        <label class="setting-row">PR skill
          <input id="set-wf-pr-skill" type="text" placeholder="hivebrite-engineering:github-pr (default)" autocomplete="off" spellcheck="false" title="Skill workflow agents open pull requests with. Empty resets to the default (hivebrite-engineering:github-pr); type 'none' to disable and follow each repo's own PR conventions with gh. Items can override this in their ⚙ Settings tab." />
        </label>
        <label class="setting-row inline">Forge
          <select id="set-wf-forge" title="Code forge for workflow PR features. Auto detects from the repo's origin remote (unknown hosts count as GitHub, so GitHub Enterprise keeps working); None disables change-request features.">
            <option value="auto">Auto-detect</option>
            <option value="github">GitHub</option>
            <option value="none">None</option>
          </select>
        </label>
        <label class="setting-row inline">Skill updates
          <select id="set-skills-update" title="Skills you never edited are always brought up to date at startup, and missing ones install themselves. This is only about skills you edited by hand: ask at startup (popup), always overwrite your edits, or always keep them.">
            <option value="ask">Ask at startup</option>
            <option value="all">Overwrite my edits</option>
            <option value="keep">Keep my edits</option>
          </select>
        </label>
        <label class="setting-row">Slack webhook
          <input id="set-wf-slack-webhook" type="text" placeholder="https://hooks.slack.com/services/…" autocomplete="off" spellcheck="false" title="Slack incoming-webhook URL for workflow sharing and notifications. Nothing is ever posted without an explicit Share action or the notify opt-in below. Empty disables Slack." />
        </label>
        <label class="setting-row">Discord webhook
          <input id="set-wf-discord-webhook" type="text" placeholder="https://discord.com/api/webhooks/…" autocomplete="off" spellcheck="false" title="Discord webhook URL for workflow sharing and notifications. Nothing is ever posted without an explicit Share action or the notify opt-in below. Empty disables Discord." />
        </label>
        <label class="setting-row inline">Notify decisions
          <select id="set-wf-notify-webhook" title="Announce workflow items parking at a decision state (plan review, diff review, PR draft) on the configured webhook. Only agent-driven transitions post — never your own clicks.">
            <option value="off">Off</option>
            <option value="slack">Slack</option>
            <option value="discord">Discord</option>
          </select>
        </label>
        <label class="setting-row">Jira site URL
          <input id="set-wf-jira-url" type="text" placeholder="https://yourorg.atlassian.net" autocomplete="off" spellcheck="false" title="Jira site URL for the share dialog's Post-to-Jira destination. Nothing is ever posted without an explicit Share action. Empty disables Jira." />
        </label>
        <label class="setting-row">Jira email
          <input id="set-wf-jira-email" type="text" placeholder="you@yourorg.com" autocomplete="off" spellcheck="false" title="Jira account email paired with the API token." />
        </label>
        <label class="setting-row">Jira API token
          <input id="set-wf-jira-token" type="password" placeholder="API token" autocomplete="off" spellcheck="false" title="Jira API token (id.atlassian.com → Security → API tokens). Stored in config.toml like the webhook URLs." />
        </label>

        <div class="settings-group">Terminal · text</div>
        <label class="setting-row">Font family
          <span class="input-with-btn">
            <input id="set-fontfamily" type="text" placeholder="SF Mono, Menlo, monospace" autocomplete="off" spellcheck="false" readonly title="Click to pick from the fonts installed on this machine" />
            <button id="set-fontfamily-pick" class="icon-btn" title="Choose a font" type="button"></button>
          </span>
        </label>
        <label class="setting-row inline">Font size
          <input id="set-fontsize" type="number" min="9" max="24" step="1" />
        </label>
        <label class="setting-row inline">Font weight
          <select id="set-font-weight">
            <option value="300">Light</option>
            <option value="normal">Normal</option>
            <option value="500">Medium</option>
            <option value="600">Semibold</option>
            <option value="bold">Bold</option>
          </select>
        </label>
        <label class="setting-row inline">Bold weight
          <select id="set-font-weight-bold">
            <option value="normal">Normal</option>
            <option value="500">Medium</option>
            <option value="600">Semibold</option>
            <option value="bold">Bold</option>
            <option value="800">Extra bold</option>
          </select>
        </label>
        <label class="setting-row inline">Line height
          <input id="set-line-height" type="number" min="1" max="2" step="0.05" />
        </label>
        <label class="setting-row inline">Letter spacing
          <input id="set-letter-spacing" type="number" min="-2" max="5" step="0.5" />
        </label>

        <div class="settings-group">Terminal · cursor</div>
        <label class="setting-row inline">Cursor style
          <select id="set-cursor-style">
            <option value="block">Block</option>
            <option value="bar">Bar</option>
            <option value="underline">Underline</option>
          </select>
        </label>
        <label class="setting-row inline">Unfocused cursor
          <select id="set-cursor-inactive">
            <option value="outline">Outline</option>
            <option value="block">Block</option>
            <option value="bar">Bar</option>
            <option value="underline">Underline</option>
            <option value="none">Hidden</option>
          </select>
        </label>
        <label class="setting-row inline">Bar cursor width
          <input id="set-cursor-width" type="number" min="1" max="5" step="1" />
        </label>
        <label class="setting-check"><input id="set-cursor-blink" type="checkbox" /> Cursor blink</label>

        <div class="settings-group">Terminal · colors</div>
        <label class="setting-row inline" title="Force a minimum contrast between text and background. 1 = off, 4.5 = WCAG AA, 21 = black on white.">Min contrast
          <input id="set-min-contrast" type="number" min="1" max="21" step="0.5" />
        </label>
        <label class="setting-check"><input id="set-bright-bold" type="checkbox" /> Bold text in bright colors</label>

        <div class="settings-group">Terminal · scroll &amp; input</div>
        <label class="setting-row inline">Scrollback lines
          <input id="set-scrollback" type="number" min="0" max="200000" step="1000" />
        </label>
        <label class="setting-row inline">Scroll speed
          <input id="set-scroll-speed" type="number" min="1" max="10" step="1" />
        </label>
        <label class="setting-row inline" title="Animation length for scroll-to-bottom jumps. 0 disables smooth scrolling.">Smooth scroll (ms)
          <input id="set-smooth-scroll" type="number" min="0" max="500" step="25" />
        </label>
        <label class="setting-check"><input id="set-copy-select" type="checkbox" /> Copy on select</label>
        <label class="setting-check"><input id="set-rclick-word" type="checkbox" /> Right-click selects word</label>
        <label class="setting-check"><input id="set-option-meta" type="checkbox" /> ⌥ sends Esc (Meta)</label>
        <label class="setting-check"><input id="set-bell-toast" type="checkbox" /> Show a toast on terminal bell</label>

        <div class="settings-group">clash</div>
        <label class="setting-row inline">Open links
          <select id="set-link-open">
            <option value="ask">Ask each time</option>
            <option value="embedded">In clash</option>
            <option value="external">System browser</option>
          </select>
        </label>
        <label class="setting-check"><input id="set-notify" type="checkbox" /> Desktop notifications</label>
        <label class="setting-check"><input id="set-title-attention" type="checkbox" /> Attention count in window title</label>
        <label class="setting-check"><input id="set-confirm-kill" type="checkbox" /> Confirm before killing a session</label>
        <label class="setting-row inline" title="How often the session list is refreshed from the backend.">Refresh every (s)
          <input id="set-refresh-secs" type="number" min="1" max="30" step="1" />
        </label>
        <label class="setting-row inline">Default shell
          <select id="set-term-shell"></select>
        </label>
        <label class="setting-row inline">Terminal for TUI
          <select id="set-tui-terminal"></select>
        </label>
        <button id="tour-guide-btn" class="update-big" title="Replay the guided tour of the window">▶ Show the tour</button>
        <button id="update-btn" class="update-big" title="Download and install the latest clash version">⟳ Update clash</button>
        </div>
        <div class="footer-row">
          <span id="session-count"></span>
          <span class="spacer"></span>
          <span id="version"></span>
        </div>
      </div>
    </aside>

    <div class="panel-resizer" id="sidebar-resizer" title="Drag to resize"></div>

    <main id="main">
      <div id="topbar">
        <div id="tabs"></div>
        <div id="topbar-actions">
          <button id="new-term-btn" class="icon-btn" title="New tab — terminal (⌘⇧T) or browser (⌘⇧B)"></button>
          <button id="stash-all-btn" class="icon-btn wide" title="Stash all running sessions">⏸ all</button>
          <button id="split-btn" class="icon-btn" title="Add split pane (⌘D)">◫</button>
          <button id="unsplit-btn" class="icon-btn" title="Close focused pane (⌘⇧D)">◻</button>
          <button id="details-btn" class="icon-btn" title="Toggle details panel">ⓘ</button>
        </div>
      </div>
      <div id="content">
        <div id="terminal-host">
          <div id="empty-state">
            <div class="empty-logo">⌘</div>
            <p>Select a session — or click to start one</p>
            <p class="hint">/ search · ⌘T new session · ⌘D split · ⌘N workspace · ⌘1-9 switch</p>
          </div>
        </div>
        <div class="panel-resizer hidden" id="details-resizer" title="Drag to resize"></div>
        <div id="details" class="hidden">
          <div id="details-body"></div>
        </div>
      </div>
    </main>
  </div>

  <!-- New session modal -->
  <div id="modal-backdrop" class="hidden">
    <div id="new-session-modal">
      <h3>New session</h3>
      <label>Working directory
        <span class="input-with-btn">
          <input id="ns-cwd" type="text" placeholder="/Users/you/project" autocomplete="off" spellcheck="false" />
          <button id="ns-browse" class="icon-btn" title="Browse for a directory" type="button"></button>
        </span>
      </label>
      <label id="ns-preset-wrap" class="hidden">Preset
        <select id="ns-preset"><option value="">— none —</option></select>
      </label>
      <label>Name <input id="ns-name" type="text" placeholder="my-feature" autocomplete="off" spellcheck="false" /></label>
      <label class="check"><input id="ns-worktree" type="checkbox" /> Create git worktree (isolated branch)</label>
      <div class="modal-actions">
        <button id="ns-cancel">Cancel</button>
        <button id="ns-create" class="primary">Create</button>
      </div>
      <div id="ns-error" class="error hidden"></div>
    </div>
  </div>

  <script src="vendor/xterm.js"></script>
  <script src="vendor/addon-fit.js"></script>
  <script src="vendor/addon-webgl.js"></script>
  <script src="vendor/marked.js"></script>
  <script src="vendor/purify.js"></script>
  <script src="wf-diff.js"></script>
  <script src="wf-compose.js"></script>
  <script src="wf-pipeline.js"></script>
  <script src="wf-review.js"></script>
  <script src="wf-timeline.js"></script>
  <script src="wf-share.js"></script>
  <script src="wf-prs.js"></script>
  <script src="tour.js"></script>
  <script src="ws-ownership.js"></script>
  <script src="app.js"></script>
</body>
</html>
